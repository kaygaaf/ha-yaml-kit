[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-yaml-kit"
version = "0.1.0"
description = "Small helpers for Home Assistant automation YAML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "kaygaaf" }]
dependencies = ["PyYAML>=6"]
keywords = ["home-assistant", "yaml", "automations"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/kaygaaf/ha-yaml-kit"

[project.scripts]
ha-yaml-kit = "ha_yaml_kit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
